[project]
name = "devtronix-model-264"
version = "0.1.0"
description = "Reverse engineering of the Devtronix Model 264 pipe-organ relay: boot ROM, system monitor, file formats, and tools to read its floppies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "capstone>=5.0",   # 68000 disassembler used by boot-rom/disasm.py and system-monitor/mdisasm.py
    "numpy>=2.4.6",    # score alignment in disklavier/tarantelle_dynamics.py
]

[tool.uv]
package = false
